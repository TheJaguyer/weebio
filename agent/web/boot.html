<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weebio</title>
    <link rel="stylesheet" href="/weebio/weebio.css">
    <script src="/weebio/common.js"></script>
</head>
<body>
    <main class="center">
        <img class="logo" src="/images/icon.png" alt="">
        <div class="spinner"></div>
        <p class="subtitle" id="status">Connecting to the internet…</p>
    </main>
    <script>
        // Open Stremio as soon as the box is online. Otherwise decide from what NetworkManager is
        // doing how long it's worth waiting before showing Wi-Fi setup:
        //   nothing saved to join      -> setup right away
        //   saved Wi-Fi but idle       -> ~6 s (out of range, router off)
        //   joined but no internet     -> ~12 s
        //   actively connecting        -> up to 30 s
        (async () => {
            const status = document.getElementById('status');
            const start = Date.now();
            const giveUpAfter = (net) => {
                if (net.state === 'disconnected') return net.savedWifi === 0 ? 1000 : 6000;
                if (net.state === 'connected' || net.state === 'limited') return 12000;
                return 30000; // connecting, or unknown
            };
            for (;;) {
                let net = { online: false, state: 'unknown', savedWifi: 0 };
                try {
                    net = await weebio.api('net');
                } catch (_) { /* agent still starting: keep waiting */ }
                if (net.online) {
                    location.replace('/');
                    return;
                }
                const waited = Date.now() - start;
                if (waited >= giveUpAfter(net)) {
                    location.replace('/weebio/setup');
                    return;
                }
                if (waited > 5000) status.textContent = 'Still looking for a connection…';
                await weebio.sleep(1000);
            }
        })();
    </script>
</body>
</html>
